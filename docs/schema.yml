components:
  schemas:
    Adresse:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        typ:
          $ref: '#/components/schemas/AdresseTypEnum'
        zusatz:
          type: string
          maxLength: 200
        strasse:
          type: string
          title: Straße
          maxLength: 200
        plz:
          type: string
          maxLength: 10
        ort:
          type: string
          maxLength: 100
        land:
          type: string
          title: Land (ISO)
          maxLength: 2
      required:
      - id
      - ort
      - plz
      - strasse
    AdresseTypEnum:
      enum:
      - HAUPT
      - RECHNUNG
      - LIEFER
      type: string
      description: |-
        * `HAUPT` - Hauptadresse
        * `RECHNUNG` - Rechnungsadresse
        * `LIEFER` - Lieferadresse
    AktionEnum:
      enum:
      - auto
      - ende
      - gehen
      - kommen
      - ruesten
      - start
      - unterbrechung
      type: string
      description: |-
        * `auto` - auto
        * `ende` - ende
        * `gehen` - gehen
        * `kommen` - kommen
        * `ruesten` - ruesten
        * `start` - start
        * `unterbrechung` - unterbrechung
    Arbeitsgang:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        code:
          type: string
          readOnly: true
        position:
          type: integer
          maximum: 2147483647
          minimum: 0
          title: AG-Nr.
        bezeichnung:
          type: string
          title: Arbeitsgang
          maxLength: 200
        arbeitsplatz:
          type: integer
          nullable: true
        ruestzeit_min:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
          title: Rüstzeit (min)
        stueckzeit_min:
          type: string
          format: decimal
          pattern: ^-?\d{0,5}(?:\.\d{0,3})?$
          title: Te je Stück (min)
        lohngruppe:
          type: string
          maxLength: 20
        lohnart:
          $ref: '#/components/schemas/LohnartEnum'
        status:
          $ref: '#/components/schemas/ArbeitsgangStatusEnum'
        gut_menge:
          type: string
          format: decimal
          pattern: ^-?\d{0,9}(?:\.\d{0,3})?$
          title: Gutmenge
        ausschuss_menge:
          type: string
          format: decimal
          pattern: ^-?\d{0,9}(?:\.\d{0,3})?$
          title: Ausschuss
        nacharbeit_menge:
          type: string
          format: decimal
          pattern: ^-?\d{0,9}(?:\.\d{0,3})?$
          title: Nacharbeit
      required:
      - bezeichnung
      - code
      - id
      - position
    ArbeitsgangStatusEnum:
      enum:
      - OFFEN
      - LAEUFT
      - UNTERBROCHEN
      - ERLEDIGT
      type: string
      description: |-
        * `OFFEN` - Offen
        * `LAEUFT` - Läuft
        * `UNTERBROCHEN` - Unterbrochen
        * `ERLEDIGT` - Erledigt
    Art1f2Enum:
      enum:
      - ER
      - AR
      - VERTRAG
      - LIEFERSCHEIN
      - SONSTIGES
      type: string
      description: |-
        * `ER` - Eingangsrechnung
        * `AR` - Ausgangsrechnung
        * `VERTRAG` - Vertrag
        * `LIEFERSCHEIN` - Lieferschein
        * `SONSTIGES` - Sonstiges
    Artikel:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        artikelnummer:
          type: string
          maxLength: 40
        bezeichnung:
          type: string
          maxLength: 200
        beschreibung:
          type: string
        art:
          allOf:
          - $ref: '#/components/schemas/ArtikelArtEnum'
          title: Artikelart
        einheit:
          type: integer
        einheit_code:
          type: string
          readOnly: true
        chargenpflicht:
          type: boolean
          title: Chargenpflichtig
