          type: integer
        einkaufspreis:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,4})?$
          title: Einkaufspreis (netto)
        verkaufspreis:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,4})?$
          title: Verkaufspreis (netto)
        gewicht_kg:
          type: string
          format: decimal
          pattern: ^-?\d{0,7}(?:\.\d{0,3})?$
          nullable: true
          title: Gewicht (kg)
