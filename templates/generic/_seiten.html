{% with s=page_obj %}{% if s.has_other_pages %}
<nav class="mt-3"><ul class="pagination pagination-sm">
  {% if s.has_previous %}<li class="page-item"><a class="page-link" href="?{% for k, v in request.GET.items %}{% if k != 'page' %}{{ k }}={{ v|urlencode }}&{% endif %}{% endfor %}page={{ s.previous_page_number }}">‹ Zurück</a></li>{% endif %}
  <li class="page-item disabled"><span class="page-link">Seite {{ s.number }} von {{ s.paginator.num_pages }}</span></li>
  {% if s.has_next %}<li class="page-item"><a class="page-link" href="?{% for k, v in request.GET.items %}{% if k != 'page' %}{{ k }}={{ v|urlencode }}&{% endif %}{% endfor %}page={{ s.next_page_number }}">Weiter ›</a></li>{% endif %}
</ul></nav>
{% endif %}{% endwith %}
