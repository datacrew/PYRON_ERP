{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:560px"><div class="card-body">
  <h1 class="h5">{{ titel }} löschen?</h1>
  <p>Soll „<strong>{{ object }}</strong>“ wirklich gelöscht werden? Dieser Vorgang wird im Audit-Log protokolliert.</p>
  <form method="post">{% csrf_token %}
    <button class="btn btn-danger">Endgültig löschen</button>
    <a class="btn btn-outline-secondary" href="{% url bearbeiten_url object.pk %}">Abbrechen</a>
  </form>
</div></div>
{% endblock %}
