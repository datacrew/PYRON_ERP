<table class="table table-sm mb-0"><thead class="table-light"><tr><th>Mitarbeiter</th><th>Arbeitsgang</th><th>Tätigkeit</th><th>seit</th></tr></thead>
<tbody>{% for st in laufend %}<tr><td>{{ st.mitarbeiter.name }}</td><td><a href="{% url 'produktion:detail' st.arbeitsgang.auftrag_id %}">{{ st.arbeitsgang.code }}</a> <small class="text-muted">{{ st.arbeitsgang.bezeichnung }}</small></td>
  <td>{{ st.get_taetigkeit_display }}</td><td>{{ st.beginn|date:"d.m. H:i" }}</td></tr>
{% empty %}<tr><td colspan="4" class="text-muted text-center">Niemand ist an einem Arbeitsgang angestempelt.</td></tr>{% endfor %}</tbody></table>
