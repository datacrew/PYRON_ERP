{% extends "base.html" %}
{% block title %}{{ titel }}{% endblock %}
{% block content %}
<div class="d-flex align-items-center mb-3"><h1 class="h4 m-0">{{ titel }}{% if form.instance.pk %}: {{ form.instance }}{% endif %}</h1>
  <a class="btn btn-sm btn-outline-secondary ms-auto" href="{{ zurueck }}"><i class="bi bi-arrow-left"></i> Zurück</a></div>
<form method="post">{% csrf_token %}
  <div class="card mb-3"><div class="card-body">{% include "generic/_formfelder.html" %}</div></div>
  <button class="btn btn-primary"><i class="bi bi-save"></i> Speichern</button>
</form>
{% endblock %}
