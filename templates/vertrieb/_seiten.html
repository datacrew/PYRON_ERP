{% if seite.has_other_pages %}<nav class="mt-3"><ul class="pagination pagination-sm">
  {% if seite.has_previous %}<li class="page-item"><a class="page-link" href="?{% for k, v in request.GET.items %}{% if k != 'seite' %}{{ k }}={{ v|urlencode }}&{% endif %}{% endfor %}seite={{ seite.previous_page_number }}">‹ Zurück</a></li>{% endif %}
  <li class="page-item disabled"><span class="page-link">Seite {{ seite.number }} von {{ seite.paginator.num_pages }}</span></li>
  {% if seite.has_next %}<li class="page-item"><a class="page-link" href="?{% for k, v in request.GET.items %}{% if k != 'seite' %}{{ k }}={{ v|urlencode }}&{% endif %}{% endfor %}seite={{ seite.next_page_number }}">Weiter ›</a></li>{% endif %}
</ul></nav>{% endif %}
