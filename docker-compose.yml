# Entwicklung/Test mit Demodaten. Produktivbetrieb: deploy/docker-compose.prod.yml (siehe deploy/INSTALLATION.md)
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: erp
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp -d erp"]
      interval: 5s
      retries: 10

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Testbetrieb über http://localhost:8000 – DEBUG an, kein HTTPS. NICHT für Produktion verwenden!
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: "*"
      ERP_HTTPS: "0"
      DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost:8000
      POSTGRES_DB: erp
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp
      POSTGRES_HOST: db
      ERP_DEMODATEN: "1"
    ports:
      - "8000:8000"
    volumes:
      - belegarchiv:/app/media

volumes:
  pgdata:
  belegarchiv:
